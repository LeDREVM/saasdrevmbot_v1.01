version: '3.8'

services:

  # ── n8n Automation ────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=http://${VPS_IP}:5678/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changethiskey32ch}
      - GENERIC_TIMEZONE=Europe/Paris
      - MT5_SERVER_HOST=signal-server
      - MT5_SERVER_PORT=5000
      # Secret partagé n8n ↔ backend (en-tête X-N8N-Secret des workflows WF5, etc.)
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      # Clé partagée EA MT5 ↔ n8n (workflow n8n_workflow_drevm.json → $env.DREVM_API_KEY)
      - DREVM_API_KEY=${DREVM_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - screenshot-service
      - signal-server
      - backend
    networks:
      - trading-net

  # ── Backend FastAPI (API vision + n8n) ───────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: drevmbot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_VISION_MODEL=${AI_VISION_MODEL:-claude-sonnet-5}
      # DOIT être identique à celui du service n8n (vérif X-N8N-Secret)
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
    networks:
      - trading-net

  # ── Screenshot Service (Puppeteer) ───────────────────────────────
  screenshot-service:
    build:
      context: ../n8n/screenshot_service
      dockerfile: Dockerfile
    container_name: screenshot-service
    restart: unless-stopped
    environment:
      - SCREENSHOT_PORT=3001
      - TRADINGVIEW_SESSION_ID=${TRADINGVIEW_SESSION_ID:-}
    networks:
      - trading-net

  # ── Signal Server (Python → MT5 bridge) ──────────────────────────
  signal-server:
    build:
      context: ../metatrader
      dockerfile: Dockerfile
    container_name: signal-server
    restart: unless-stopped
    ports:
      - "5001:5001"    # Socket EA ↔ Python (accessible depuis MT5)
    environment:
      - MT5_SERVER_PORT=5000
      - MT5_BRIDGE_PORT=5001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    networks:
      - trading-net

  # ── Serveur Express (hub GoldyXbOT + dashboard /correlations) ────
  express-hub:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: drevm-express-hub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ENABLE_SAAS_API=true
      - SAAS_API_URL=http://backend:8000
      - DISCORD_WEBHOOK_URLS=${DISCORD_WEBHOOK_URLS:-}
      - TIMEZONE=${GENERIC_TIMEZONE:-Europe/Paris}
    depends_on:
      - backend
    networks:
      - trading-net

  # ── Orchestrateur prep session NY (daemon, 07:00 UTC = 3h Guadeloupe) ──
  orchestrator:
    build:
      context: ..
      dockerfile: deploy/orchestrator.Dockerfile
    container_name: drevm-ny-orchestrator
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
      - SCREENSHOT_URL=http://screenshot-service:3001
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - NY_MIN_GRADE=${NY_MIN_GRADE:-A}
      - NY_NEWS_BLACKOUT=${NY_NEWS_BLACKOUT:-1}
      - NY_WEEKDAYS_ONLY=${NY_WEEKDAYS_ONLY:-1}
    depends_on:
      - backend
      - screenshot-service
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge

volumes:
  n8n_data:
