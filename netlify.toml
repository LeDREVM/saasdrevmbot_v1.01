# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Netlify — saasDrevmBot Frontend (SvelteKit)
# Seul le frontend SvelteKit est déployé ici.
# Le backend FastAPI et GoldyXbOT (Express)
# doivent être hébergés séparément (Railway, Render, VPS).
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[build]
  # Dossier de base : le frontend SvelteKit
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "build"

  # Netlify Functions (à la racine du repo, hors du dossier frontend)
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # VITE_API_URL non requis : le calendrier passe par la Netlify Function /api/calendar
  VITE_API_URL = ""

# ── Calendrier économique → Netlify Function ──────────────────────────────────
[[redirects]]
  from   = "/api/calendar"
  to     = "/.netlify/functions/calendar"
  status = 200

# ── SPA Fallback (SvelteKit adapter-static) ───────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers sécurité ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    X-XSS-Protection         = "1; mode=block"
    Referrer-Policy          = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
