# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Netlify — saasDrevmBot Frontend (SvelteKit)
# Seul le frontend SvelteKit est déployé ici.
# Le backend FastAPI et GoldyXbOT (Express)
# doivent être hébergés séparément (Render, VPS).
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[build]
  # Dossier de base : le frontend SvelteKit
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "build"

  # Netlify Functions (à la racine du repo, hors du dossier frontend)
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # ── Choix du câblage backend (2 modes) ──────────────────────────────────────
  # MODE A · Reverse-proxy (recommandé) : le front appelle /api/* en RELATIF et
  #   Netlify proxifie vers tes backends (voir les redirects [proxy backend] plus bas).
  #   → Poser VITE_API_URL = "" ci-dessous ET décommenter les redirects proxy.
  #   Avantage : pas de CORS, aucune URL backend figée dans le bundle.
  #
  # MODE B · CORS direct : définir VITE_API_URL dans Netlify → Site settings →
  #   Environment variables avec l'URL FastAPI déployée (ex. https://api.mondomaine.com).
  #   Ne PAS mettre VITE_API_URL = "" en dur ici en mode B.
  #
  # Le calendrier public (/api/calendar) passe toujours par la fonction Netlify,
  # aucun backend requis pour lui.
  #
  # VITE_API_URL = ""   # ← décommenter pour le MODE A (reverse-proxy)

# ── Calendrier économique → Netlify Function ──────────────────────────────────
[[redirects]]
  from   = "/api/calendar"
  to     = "/.netlify/functions/calendar"
  status = 200

# ── Endpoints n8n → Netlify Functions ─────────────────────────────────────────
[[redirects]]
  from   = "/api/n8n/calendar/today"
  to     = "/.netlify/functions/n8n-calendar-today"
  status = 200

[[redirects]]
  from   = "/api/n8n/notify/telegram"
  to     = "/.netlify/functions/n8n-notify-telegram"
  status = 200

# ── [proxy backend] Reverse-proxy vers les backends (MODE A) ──────────────────
# Décommenter et remplacer les URLs par tes backends déployés. L'ORDRE compte :
# ces règles doivent rester AVANT le fallback SPA /* ci-dessous, et la règle
# Express (spécifique) AVANT la règle FastAPI (générale).
#
# Corrélations news/prix = backend Express « GoldyXbOT »
# [[redirects]]
#   from   = "/api/stats/correlations"
#   to     = "https://TON-EXPRESS.exemple.com/api/stats/correlations"
#   status = 200
#   force  = true
#
# Reste de l'API applicative = backend FastAPI (:splat = tout ce qui suit)
# [[redirects]]
#   from   = "/api/*"
#   to     = "https://TON-FASTAPI.exemple.com/api/:splat"
#   status = 200
#   force  = true
#
# Health check FastAPI (route racine /health, hors /api/*) — utilisé par la page d'accueil
# [[redirects]]
#   from   = "/health"
#   to     = "https://TON-FASTAPI.exemple.com/health"
#   status = 200
#   force  = true

# ── [proxy console] Console NY Bot accessible depuis partout via Netlify ──────
# La console (moteur Python :8800) NE PEUT PAS être hébergée sur Netlify — elle
# tourne sur ton VPS. Ce proxy te donne une URL publique stable :
#   https://TON-SITE.netlify.app/bot/  →  console du VPS.
#
# Étapes :
#  1. Sur le VPS : exposer la console en HTTPS. Le plus simple, SANS ouvrir de
#     port : Cloudflare Tunnel →  cloudflared tunnel --url http://localhost:8800
#     (donne une URL https://xxxx.trycloudflare.com, ou un tunnel nommé pour une
#     URL stable). Alternative : reverse-proxy nginx + certificat.
#  2. Sur le VPS, dans ny_session_interface/.env :  REQUIRE_TOKEN=1  et un
#     API_TOKEN long et aléatoire — SINON équité/positions/logs seraient publics.
#     (Saisis ensuite ce token dans le champ « API token » de la console.)
#  3. Décommenter ci-dessous et remplacer l'URL par celle du tunnel. L'ORDRE
#     compte : garder ces règles AVANT le fallback SPA /*.
#
# [[redirects]]                       # /bot sans slash → /bot/ (chemins relatifs)
#   from   = "/bot"
#   to     = "/bot/"
#   status = 301
#
# [[redirects]]
#   from   = "/bot/*"
#   to     = "https://TON-TUNNEL.trycloudflare.com/:splat"
#   status = 200
#   force  = true

# ── SPA Fallback (SvelteKit adapter-static) ───────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers sécurité ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    X-XSS-Protection         = "1; mode=block"
    Referrer-Policy          = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
