# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Netlify — saasDrevmBot Frontend (SvelteKit)
# Seul le frontend SvelteKit est déployé ici.
# Le backend FastAPI et GoldyXbOT (Express)
# doivent être hébergés séparément (Railway, Render, VPS).
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[build]
  # Dossier de base : le frontend SvelteKit
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "build"

  # Netlify Functions (à la racine du repo, hors du dossier frontend)
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # NE PAS fixer VITE_API_URL = "" ici : une chaîne vide est "falsy" et le fallback
  # localhost:8000 de config.js serait alors figé dans le bundle déployé (injoignable).
  # Le calendrier public passe par la fonction Netlify /api/calendar (aucun backend requis).
  # Pour activer les pages qui parlent à FastAPI (alertes, scoring, statut backend),
  # définir VITE_API_URL dans Netlify → Site settings → Environment variables
  # avec l'URL du backend FastAPI déployé (ex. https://api.mondomaine.com).

# ── Calendrier économique → Netlify Function ──────────────────────────────────
[[redirects]]
  from   = "/api/calendar"
  to     = "/.netlify/functions/calendar"
  status = 200

# ── Endpoints n8n → Netlify Functions ─────────────────────────────────────────
[[redirects]]
  from   = "/api/n8n/calendar/today"
  to     = "/.netlify/functions/n8n-calendar-today"
  status = 200

[[redirects]]
  from   = "/api/n8n/notify/telegram"
  to     = "/.netlify/functions/n8n-notify-telegram"
  status = 200

# ── SPA Fallback (SvelteKit adapter-static) ───────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers sécurité ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    X-XSS-Protection         = "1; mode=block"
    Referrer-Policy          = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
